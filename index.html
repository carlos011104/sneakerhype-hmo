        const getNextSunday = () => {
          const now = new Date();
          const day = now.getDay();
          const daysUntilSunday = (7 - day) % 7 || 7;
          const target = new Date(now.getFullYear(), now.getMonth(), now.getDate() + daysUntilSunday, 23, 59, 59);
          return target.getTime();
        };
        const targetTime = getNextSunday();

        const updateCountdown = () => {
          const now = new Date().getTime();
          const diff = Math.max(0, targetTime - now);
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);
          setTimeLeft({ days, hours, minutes, seconds });
        };
        updateCountdown();
        const interval = setInterval(updateCountdown, 1000);
        return () => clearInterval(interval);

                    href={"https://wa.me/" + city.whatsapp + "?text=" + encodeURIComponent("Hola " + city.partnerName + " de SneakerHype " + city.name + "! Quiero anotarme en la lista VIP para tener acceso prioritario en cuanto abran los slots del Drop #02 de Nike Air Max 90.")}
                    target="_blank"
                    className="flex items-center justify-center gap-2 w-full py-3 px-4 rounded-xl font-black text-xs bg-amber-500 hover:bg-amber-400 text-stone-950 transition shadow-lg shadow-amber-950/40"
                  >
                    <span>💬 Acceso Prioritario con {city.partnerName}</span>
                  </a>
                </div>
              </div>
            </section>

            <section className="rounded-3xl bg-stone-900/70 border border-stone-800 p-6 sm:p-8 space-y-5">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <h3 className="text-lg font-black text-white">¿Cómo funciona la compra bajo pedido?</h3>
                <span className="text-xs text-orange-400 font-bold">Entrega segura en Sonora</span>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                <div className="bg-stone-950 p-4 rounded-2xl border border-stone-800 space-y-1.5">
                  <span className="text-orange-400 font-black text-sm">1. Aparta tu slot de importación</span>
                  <p className="text-stone-400 leading-relaxed">Eliges modelo, talla y ciudad. Aseguras tu lugar en el batch con el anticipo correspondiente (en Drop #01: $1,500 MXN).</p>
                </div>
                <div className="bg-stone-950 p-4 rounded-2xl border border-stone-800 space-y-1.5">
                  <span className="text-amber-300 font-black text-sm">2. Full Set garantizado</span>
                  <p className="text-stone-400 leading-relaxed">Cada par se importa con sus especificaciones completas (caja, cubrepolvo y accesorios).</p>
                </div>
                <div className="bg-stone-950 p-4 rounded-2xl border border-stone-800 space-y-1.5">
                  <span className="text-emerald-400 font-black text-sm">3. Liquidas al recibir en mano</span>
                  <p className="text-stone-400 leading-relaxed">Pagas el saldo restante únicamente cuando tengas físicamente tu par en mano en Hermosillo o tu municipio aliado. Cero riesgo.</p>
                </div>
              </div>
            </section>

            <section className="rounded-3xl bg-stone-900/70 border border-stone-800 p-6 sm:p-8 space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-2 border-b border-stone-800 pb-3">
                <div>
                  <h3 className="text-lg font-black text-white">Preguntas Frecuentes (FAQ)</h3>
                  <p className="text-xs text-stone-400">Todo lo que necesitas saber antes de apartar tu par en Sonora.</p>
                </div>
                <span className="text-xs font-bold text-orange-400">Garantía &amp; Transparencia</span>
              </div>
              <div className="space-y-2.5">
                {FAQS.map((faq, idx) => {
                  const isOpen = openFaq === idx;
                  return (
                    <div
                      key={idx}
                      className="rounded-2xl border border-stone-800 bg-stone-950 overflow-hidden transition"
                    >
                      <button
                        onClick={() => setOpenFaq(isOpen ? null : idx)}
                        className="w-full p-4 text-left flex items-center justify-between gap-3 hover:bg-stone-900/50 transition cursor-pointer"
                      >
                        <span className="text-xs sm:text-sm font-bold text-stone-200">
                          {faq.q}
                        </span>
                        <span className={"text-xs text-orange-400 font-black transition-transform duration-200 " + (isOpen ? "rotate-180" : "")}>
                          ▼
                        </span>
                      </button>
                      {isOpen && (
                        <div className="px-4 pb-4 pt-1 text-xs text-stone-400 leading-relaxed border-t border-stone-900">
                          {faq.a}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
              <footer className="pt-4 border-t border-stone-800 flex flex-wrap items-center justify-between gap-2 text-[11px] text-stone-500">
                <span>© 2026 SneakerHype HMO • Todos los derechos reservados</span>
                <a href="https://instagram.com/sneaker_hypehmo" target="_blank" className="text-stone-400 hover:text-orange-400 font-bold">@sneaker_hypehmo</a>
              </footer>
            </section>
          </main>
          {/* Botón flotante de WhatsApp para atención rápida */}
          <aside className="fixed bottom-5 right-5 z-40">
            <a
              href={"https://wa.me/" + city.whatsapp + "?text=" + encodeURIComponent("Hola " + city.partnerName + " de SneakerHype " + city.name + "! Tengo una duda sobre el Drop #01 de Golden Goose.")}
              target="_blank"
              className="group flex items-center gap-2.5 bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-3 rounded-full shadow-2xl shadow-emerald-950/80 border border-emerald-400/40 transition-all hover:scale-105"
              title={"Atención directa por WhatsApp con " + city.partnerName + " en " + city.name}
            >
              <span className="relative flex h-3 w-3">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-300 opacity-75"></span>
                <span className="relative inline-flex rounded-full h-3 w-3 bg-white"></span>
              </span>
              <span className="text-xs font-black tracking-wide hidden sm:inline">
                WhatsApp {city.name} • {city.partnerName}
              </span>
              <span className="text-xs font-black tracking-wide sm:hidden">
                WhatsApp {city.partnerName}
              </span>
            </a>
          </aside>
          {zoomItem && (
            <div onClick={() => setZoomItem(null)} className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 cursor-zoom-out">
              <div onClick={e => e.stopPropagation()} className="relative max-w-2xl w-full bg-stone-900 border border-stone-700 rounded-3xl p-4 space-y-3 cursor-default">
                <div className="flex justify-between items-start gap-3">
                  <div>
                    <span className="text-xs font-bold text-orange-400">{zoomItem.code} • {zoomItem.tag}</span>
                    <h3 className="text-base font-black text-white">{zoomItem.name}</h3>
                    <p className="text-xs text-stone-400">{zoomItem.colorway}</p>
                  </div>
                  <button onClick={() => setZoomItem(null)} className="px-2.5 py-1 rounded-lg bg-stone-800 text-stone-300 hover:text-white">✕</button>
                </div>
                <div className="bg-stone-950 rounded-2xl p-2 flex items-center justify-center">
                  <img
                    src={getMediaSrc(zoomItem.id, "photo", zoomItem.photoRef)}
                    alt={zoomItem.name}
                    className="max-h-[70vh] w-auto object-contain rounded-xl"
                  />
                </div>
              </div>
            </div>
          )}
          {showPinModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <form onSubmit={handlePinSubmit} className="bg-stone-900 border border-stone-700 rounded-3xl max-w-sm w-full p-6 space-y-4">
                <div className="flex justify-between items-start border-b border-stone-800 pb-3">
                  <div>
                    <span className="text-xs font-bold text-orange-400">Acceso Privado</span>
                    <h3 className="text-lg font-black text-white">Modo Socios SneakerHype</h3>
                  </div>
                  <button type="button" onClick={() => { setShowPinModal(false); setPinError(""); setPinInput(""); }} className="px-2.5 py-1 rounded-lg bg-stone-800 text-stone-300">✕</button>
                </div>
                <p className="text-xs text-stone-400">Ingresa el PIN de 6 dígitos para ver precios mayoreo y la calculadora de ganancias.</p>
                <input
                  type="password"
                  inputMode="numeric"
                  maxLength={6}
                  autoFocus
                  value={pinInput}
                  onChange={e => { setPinInput(e.target.value); setPinError(""); }}
                  placeholder="PIN de 6 dígitos"
                  className="w-full bg-stone-950 border border-stone-700 focus:border-orange-500 outline-none rounded-xl px-4 py-3 text-center text-lg tracking-widest font-mono text-white"
                />
                {pinError && <p className="text-xs text-rose-400 font-bold text-center">{pinError}</p>}
                <button type="submit" className="w-full py-3 rounded-2xl bg-orange-600 hover:bg-orange-500 text-white font-extrabold text-sm">
                  Desbloquear Panel
                </button>
              </form>
            </div>
          )}
          {modalItem && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-stone-900 border border-stone-700 rounded-3xl max-w-lg w-full p-6 space-y-4">
                <div className="flex justify-between items-start border-b border-stone-800 pb-3">
                  <div>
                    <span className="text-xs font-bold text-orange-400">SneakerHype HMO • {modalItem.code}</span>
                    <h3 className="text-lg font-black text-white">{modalItem.name}</h3>
                    <p className="text-xs text-stone-400">Full Set</p>
                  </div>
                  <button onClick={() => setModalItem(null)} className="px-2.5 py-1 rounded-lg bg-stone-800 text-stone-300">✕</button>
                </div>
                <input
                  type="text"
                  value={clientName}
                  onChange={e => setClientName(e.target.value)}
                  placeholder="Tu nombre (opcional)"
                  className="w-full bg-stone-950 border border-stone-800 rounded-xl px-3 py-2 text-xs text-white"
                />
                <div className="bg-stone-950 rounded-2xl p-4 border border-stone-800 space-y-1.5 text-xs">
                  <div className="flex justify-between"><span>Talla seleccionada:</span><strong className="text-orange-400">{getSize(modalItem.id)}</strong></div>
                  <div className="flex justify-between"><span>Ciudad de entrega:</span><strong className="text-white">{city.name} ({city.deliverySpot})</strong></div>
                  <div className="flex justify-between"><span>Socio / Atención directa:</span><strong className="text-amber-300">{city.partnerName} ({city.phoneDisplay})</strong></div>
                  <div className="flex justify-between text-orange-400 font-bold"><span>Apartado Hoy:</span><span>$1,500 MXN</span></div>
                  <div className="flex justify-between text-emerald-400 font-bold"><span>Liquidación al recibir:</span><span>$1,200 MXN (Total $2,700)</span></div>
                </div>
                <div className="bg-stone-950/80 rounded-2xl p-3 border border-stone-800 text-[11px] text-stone-300 space-y-1">
                  <div className="flex items-center gap-1.5 font-bold text-amber-400">
                    <span>💳</span>
                    <span>Método de Apartado Seguro:</span>
                  </div>
                  <p className="text-stone-400 leading-relaxed">
                    Al hacer clic abajo se abrirá tu WhatsApp con {city.partnerName} ({city.name}). Te compartirá los datos de transferencia bancaria (SPEI / Oxxo) para apartar tu par con $1,500 MXN y entregarte personalmente.
                  </p>
                </div>
                <a
                  href={"https://wa.me/" + city.whatsapp + "?text=" + encodeURIComponent("Hola " + city.partnerName + " de SneakerHype " + city.name + "! " + (clientName ? "Soy " + clientName + ". " : "") + "Quiero apartar el modelo *" + modalItem.name + "* (" + modalItem.code + " • Full Set) en talla *" + getSize(modalItem.id) + "* para entrega en *" + city.name + "* (" + city.deliverySpot + "). Apartado hoy: $1,500 MXN | Restante al recibir: $1,200 MXN.")}
                  target="_blank"
                  className="block w-full text-center py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-sm shadow-lg shadow-emerald-900/30"
                >
                  Enviar Apartado por WhatsApp con {city.partnerName} ({city.name} • {city.phoneDisplay})
                </a>
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<SneakerHypeApp />);
  </script>
</body>
</html>
