<svg viewBox="0 0 600 600" width="1200" height="1200" xmlns="http://www.w3.org/2000/svg">
  <!-- Sombra exterior suave para corte troquelado (Die-Cut Sticker) -->
  <circle cx="300" cy="300" r="286" fill="#FFFFFF" stroke="#111111" stroke-width="12" />
  <circle cx="300" cy="300" r="212" fill="#FFFFFF" stroke="#111111" stroke-width="8" />

  <!-- Definición de curvas para el texto circular -->
  <defs>
    <path id="topArcSticker" d="M 76,300 A 224,224 0 1,1 524,300" />
    <path id="bottomArcSticker" d="M 532,300 A 232,232 0 0,1 68,300" />
  </defs>

  <!-- Texto Superior Curvo: SNEAKER HYPE -->
  <text fill="#111111" font-family="'Inter', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="50" letter-spacing="4">
    <textPath href="#topArcSticker" startOffset="50%" text-anchor="middle">
      SNEAKER HYPE
    </textPath>
  </text>

  <!-- Líneas divisoras laterales en el anillo -->
  <path d="M 55 320 A 248 248 0 0 0 165 505" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" />
  <path d="M 545 320 A 248 248 0 0 1 435 505" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" />

  <!-- Texto Inferior Curvo: HMO -->
  <text fill="#111111" font-family="'Inter', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="6">
    <textPath href="#bottomArcSticker" startOffset="50%" text-anchor="middle">
      HMO
    </textPath>
  </text>

  <!-- ILUSTRACIÓN CENTRAL: CAJAS APILADAS + SNEAKER RETRO HYPE -->
  <!-- Caja Inferior (Negro + Gris) -->
  <g transform="translate(135, 345)">
    <!-- Cuerpo Caja Inferior -->
    <rect x="0" y="20" width="210" height="75" fill="#27272A" stroke="#111111" stroke-width="7" stroke-linejoin="round" />
    <rect x="210" y="20" width="120" height="75" fill="#A1A1AA" stroke="#111111" stroke-width="7" stroke-linejoin="round" />
    <!-- Tapa Caja Inferior -->
    <rect x="-6" y="0" width="216" height="24" fill="#18181B" stroke="#111111" stroke-width="7" stroke-linejoin="round" />
    <rect x="210" y="0" width="126" height="24" fill="#D4D4D8" stroke="#111111" stroke-width="7" stroke-linejoin="round" />
    <!-- Orificio de agarre -->
    <path d="M 255 24 A 16 14 0 0 0 287 24 Z" fill="#111111" />
  </g>

  <!-- Caja Superior Naranja (Color Oficial SneakerHype HMO) -->
  <g transform="translate(155, 272)">
    <!-- Cuerpo Caja Naranja -->
    <rect x="0" y="18" width="195" height="56" fill="#D97338" stroke="#111111" stroke-width="7" stroke-linejoin="round" />
    <rect x="195" y="18" width="95" height="56" fill="#C25E25" stroke="#111111" stroke-width="7" stroke-linejoin="round" />
    <!-- Tapa Caja Naranja -->
    <rect x="-5" y="0" width="200" height="20" fill="#D97338" stroke="#111111" stroke-width="7" stroke-linejoin="round" />
    <rect x="195" y="0" width="100" height="20" fill="#C25E25" stroke="#111111" stroke-width="7" stroke-linejoin="round" />
    <!-- Orificio de agarre -->
    <path d="M 232 20 A 14 12 0 0 0 258 20 Z" fill="#111111" />
  </g>

  <!-- Recorte circular limpio para que las cajas queden dentro del medallón central -->
  <circle cx="300" cy="300" r="212" fill="none" stroke="#111111" stroke-width="9" />

  <!-- SNEAKER STREETWEAR SOBRE LA CAJA NARANJA -->
  <g transform="translate(145, 130)">
    <!-- Suela y Entresuela -->
    <path d="M 12 122 L 298 122 C 306 122 308 140 292 142 L 18 142 C 6 142 6 122 12 122 Z" fill="#FFFFFF" stroke="#111111" stroke-width="7" stroke-linejoin="round" />
    <!-- Cápsula de aire en suela -->
    <rect x="48" y="128" width="46" height="8" rx="4" fill="#111111" />

    <!-- Cuerpo del Sneaker -->
    <path d="M 18 122 C 16 88 22 52 30 34 C 36 24 46 38 62 46 C 85 48 112 20 128 8 C 142 2 155 12 162 28 L 238 82 C 272 86 296 98 300 122 Z"
          fill="#FFFFFF" stroke="#111111" stroke-width="7" stroke-linejoin="round" />

    <!-- Cage / Malla Lateral icónica -->
    <polygon points="102,52 162,48 175,86 95,88" fill="#F4F4F5" stroke="#111111" stroke-width="6" stroke-linejoin="round" />
    <line x1="122" y1="50" x2="118" y2="87" stroke="#111111" stroke-width="4" />
    <line x1="142" y1="49" x2="140" y2="87" stroke="#111111" stroke-width="4" />

    <!-- Ala / Soporte triangular lateral -->
    <path d="M 65 55 L 118 42 L 95 95 Z" fill="#FFFFFF" stroke="#111111" stroke-width="6" stroke-linejoin="round" />

    <!-- Detalles de costura y puntera -->
    <path d="M 185 95 C 220 95 258 102 295 114" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" />
    <path d="M 22 92 C 48 92 75 104 98 120" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" />

    <!-- Agujetas cruzadas -->
    <line x1="152" y1="32" x2="170" y2="24" stroke="#111111" stroke-width="6" stroke-linecap="round" />
    <line x1="168" y1="45" x2="186" y2="37" stroke="#111111" stroke-width="6" stroke-linecap="round" />
    <line x1="184" y1="58" x2="202" y2="50" stroke="#111111" stroke-width="6" stroke-linecap="round" />
    <line x1="200" y1="71" x2="218" y2="63" stroke="#111111" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>